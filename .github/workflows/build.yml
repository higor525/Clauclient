name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 8
      - name: Compilar
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle-2.14.1-bin.zip
          ./gradle-2.14.1/bin/gradle setupCIWorkspace build --no-daemon > build.log 2>&1 || (grep -A3 "error:" build.log | sed 's#/home/runner/work/Clauclient/Clauclient/build/sources/main/java/com/clauclient/##' | head -60 >> $GITHUB_STEP_SUMMARY; exit 1)
      - uses: actions/upload-artifact@v4
        with:
          name: ClauClient
          path: build/libs/*.jar